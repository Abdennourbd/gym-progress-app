name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: build
        run: npm run build
        env:
          AUTH_SECRET: build-only-secret-build-only-secret-1234

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: install the browser
        run: npx playwright install --with-deps chromium

      - name: build
        run: npm run build
        env:
          AUTH_SECRET: build-only-secret-build-only-secret-1234

      - name: run the browser tests
        run: npm run test:e2e
